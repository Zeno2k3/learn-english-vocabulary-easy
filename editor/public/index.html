<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spell Quest · Sửa dữ liệu</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">SQ</span><div><strong>Spell Quest</strong><small>Trình chỉnh sửa dữ liệu</small></div></div>
  <div class="doc-title" id="docTitle"></div>
  <div class="actions">
    <span class="status" id="status"></span>
    <a class="btn ghost" id="preview" target="_blank" rel="noopener" hidden>Xem trên web ↗</a>
    <button class="btn ghost" id="btnCheck" disabled>Kiểm tra</button>
    <button class="btn primary" id="btnSave" disabled title="Ctrl+S">Lưu</button>
  </div>
</header>
<div class="layout">
  <aside class="side">
    <div class="side-head"><span>Bài học</span><button class="btn small" id="btnNew">＋ Bài mới</button></div>
    <nav id="lessonList"></nav>
    <div class="side-head"><span>Dữ liệu chung</span></div>
    <nav id="globalList"></nav>
    <p class="side-note">Sửa xong bấm <b>Lưu</b> để ghi vào <code>data/</code>. Chạy thêm <code>npm run dev</code> để xem ngay trên web.</p>
  </aside>
  <main class="main">
    <nav class="tabs" id="tabs"></nav>
    <section class="content" id="content">
      <div class="empty">Chọn một bài ở cột bên trái để bắt đầu sửa.</div>
    </section>
  </main>
  <aside class="issues" id="issues" hidden>
    <div class="issues-head"><strong>Kiểm tra dữ liệu</strong><span id="issueSum"></span></div>
    <div id="issueList"></div>
  </aside>
</div>

<dialog id="newDialog">
  <form method="dialog" id="newForm">
    <h2>Thêm bài học mới</h2>
    <label class="f"><span class="lab">Số bài</span><input name="id" type="number" min="1" required></label>
    <label class="f"><span class="lab">Tên bài</span><input name="title" required placeholder="Ví dụ: Jobs"></label>
    <label class="f"><span class="lab">Tên file</span><input name="file" required pattern="\d+-[a-z0-9-]+\.json" placeholder="07-jobs.json"><small>Chữ thường không dấu, số đầu trùng số bài.</small></label>
    <label class="check"><input type="checkbox" name="fromTemplate"> Bắt đầu từ file mẫu <code>_template.json</code></label>
    <p class="form-note">Bài mới chỉ được ghi ra file khi bạn bấm <b>Lưu</b>.</p>
    <div class="dialog-actions">
      <button class="btn ghost" value="cancel" formnovalidate>Huỷ</button>
      <button class="btn primary" value="ok">Tạo bài</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<datalist id="dl-types"></datalist>
<datalist id="dl-images"></datalist>
<datalist id="dl-words"></datalist>
<script src="editor.js"></script>
</body>
</html>
